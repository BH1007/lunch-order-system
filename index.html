<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCBC Global Markets Working Lunch Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>OCBC Global Markets Working Lunch Portal</h1>
        <p>選擇今天的午餐</p>
    </header>

    <main>

        <section>
            <h2>今日餐廳</h2>
            <div id="restaurant-info">
                <h3>今日餐廳：還沒決定</h3>
                <p>請等待管理員選擇今天的餐廳。</p>
            </div>
        </section>

        <section>
            <h2>今日菜單</h2>
            <div id="menu">
                <p>目前還沒有菜單。</p>
            </div>
        </section>

        <section>
            <h2>我的購物車</h2>
            <div id="cart">
                <p>購物車目前是空的。</p>
            </div>

            <h3>總金額：$<span id="total">0</span></h3>

            <div class="checkout">
                <h3>訂購資料</h3>

                <label for="customer-name">姓名</label>
                <input
                    type="text"
                    id="customer-name"
                    placeholder="請輸入姓名"
                >

                <label for="order-note">備註</label>
                <textarea
                    id="order-note"
                    placeholder="例如：不要辣、不要香菜"
                ></textarea>

                <button id="submit-order">
                    確認送出訂單
                </button>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
