<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCBC Global Markets Working Lunch Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Working Lunch Portal</h1>
        <p>Select Today's Order</p>
    </header>

    <main>

        <section>
            <h2>Today's Restaurant</h2>
            <div id="restaurant-info">
                <h3>Pending Selection</h3>
                <p>Awaiting Intern Configuration</p>
            </div>
        </section>

        <section>
            <h2>Daily Menu</h2>
            <div id="menu">
                <p>No Menu Available</p>
            </div>
        </section>

        <section>
            <h2>Order Cart</h2>
            <div id="cart">
                <p>Cart is Empty</p>
            </div>

            <h3>Total Amount：$<span id="total">0</span></h3>

            <div class="checkout">
                <h3>Order Details</h3>

                <label for="customer-name">Name</label>
                <input
                    type="text"
                    id="customer-name"
                    placeholder="Enter Name"
                >

                <label for="order-note">Special Instructions (Optional) </label>
                <textarea
                    id="order-note"
                    placeholder="e.g., No spicy, dressing on side"
                ></textarea>

                <button id="submit-order">
                    Submit Order
                </button>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
