<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Intern Admin</h1>
        <p>Configure today's lunch vendor</p>
    </header>

    <main>

        <section>
            <h2>Vendor Configuration</h2>

            <select id="restaurant-select">
                <option value="">Select a vendor</option>
                <option value="菜菜優纖">菜菜優纖</option>
                <option value="樂天皇朝">樂天皇朝</option>
                <option value="餃子の王將">餃子の王將</option>
                <option value="大戶屋">大戶屋</option>
                <option value="TGI FRIDAYS">TGI FRIDAYS</option>
                <option value="開飯川食堂">開飯川食堂</option>
                <option value="大心">大心</option>
            </select>

            <button id="save-restaurant">
                Set as Today's Vendor
            </button>

            <div id="current-restaurant">
                <p>No vendor configured for today yet</p>
            </div>

        </section>

        <section>
            <h2>Today's Order Analytics</h2>
            <div id="order-summary">
                <p>No analytics data available at the moment.</p>
            </div>
        </section>

        <section>
            <h2>Live Desk Orders</h2>
            <button id="clear-orders">
                Clear Today's Records
            </button>

            <div id="orders">
                <p>No orders placed today.</p>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>
</html>
