<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>午餐系統｜管理員</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>午餐系統管理員</h1>
        <p>設定今天公司要吃的餐廳</p>
    </header>

    <main>

        <section>
            <h2>今日餐廳設定</h2>

            <select id="restaurant-select">
                <option value="">請選擇餐廳</option>
                <option value="菜菜優纖">菜菜優纖</option>
                <option value="樂天皇朝">樂天皇朝</option>
                <option value="餃子の王將">餃子の王將</option>
                <option value="大戶屋">大戶屋</option>
                <option value="TGI FRIDAYS">TGI FRIDAYS</option>
                <option value="開飯川食堂">開飯川食堂</option>
                <option value="大心">大心</option>
            </select>

            <button id="save-restaurant">
                設定為今日餐廳
            </button>

            <div id="current-restaurant">
                <p>目前尚未設定今日餐廳</p>
            </div>

        </section>

        <section>
            <h2>今日訂餐統計</h2>
            <div id="order-summary">
                <p>目前還沒有統計資料。</p>
            </div>
        </section>

        <section>
            <h2>📋 今日訂單</h2>
            <button id="clear-orders">
                🗑️ 清空今日訂單
            </button>

            <div id="orders">
                <p>目前還沒有訂單。</p>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>
</html>
